<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bei Cin Lah back office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
:root{--bg:#f4f7fb;--surface:#fff;--ink:#14213d;--muted:#5d6b82;--line:#e2e8f0;--grid:#eef2f7;--accent:#2f80ed;--accent-soft:#e8f1fd;--good:#15803d;--good-bg:#e7f6ec;--warn:#a15c07;--warn-bg:#fdf3e1;--bad:#b42318;--bad-bg:#fdecea;--font:'Nunito',system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--surface:#172033;--ink:#e8eefb;--muted:#9aa7bd;--line:#26324a;--grid:#1f2a40;--accent:#5b9cf2;--accent-soft:#1d2d4a;--good:#4ade80;--good-bg:#173226;--warn:#f5b84c;--warn-bg:#36290f;--bad:#f87171;--bad-bg:#3a1a1a}}
:root[data-theme="dark"]{--bg:#0f1626;--surface:#172033;--ink:#e8eefb;--muted:#9aa7bd;--line:#26324a;--grid:#1f2a40;--accent:#5b9cf2;--accent-soft:#1d2d4a;--good:#4ade80;--good-bg:#173226;--warn:#f5b84c;--warn-bg:#36290f;--bad:#f87171;--bad-bg:#3a1a1a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;font-weight:900;margin:0;line-height:1.2}
h2{font-size:18px;font-weight:800;margin:28px 0 10px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between}
button,.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;white-space:nowrap}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input,select{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.lock{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px}
.err{color:var(--bad);font-weight:700;margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile .k{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:26px;font-weight:900;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px}
.chart h3{margin:0 0 2px;font-size:15px;font-weight:800}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .bar{fill:var(--accent)} .chart .hit{fill:transparent;cursor:default} .chart .hit:hover+.bar,.chart .bar.on{fill:var(--ink)}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font)} .chart .gl{stroke:var(--grid);stroke-width:1}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;padding:6px 10px;border-radius:8px;white-space:nowrap;z-index:9;display:none}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:800;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.main{cursor:pointer} tr.main:hover td{background:var(--accent-soft)}
tr.detail td{background:var(--bg);padding:14px 16px}
.pill{display:inline-block;font-size:12px;font-weight:800;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill.paid{background:var(--good-bg);color:var(--good)} .pill.sent{background:var(--warn-bg);color:var(--warn)} .pill.unpaid{background:var(--bad-bg);color:var(--bad)} .pill.payer{background:var(--accent-soft);color:var(--accent)}
.sub{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.sub table{font-size:13px} .sub th,.sub td{padding:6px 8px}
.empty{padding:24px;text-align:center;color:var(--muted)}
@media (max-width:600px){h1{font-size:20px}.tile .v{font-size:22px}.hide-sm{display:none}}
</style>
</head>
<body>
<main id="admin"><p class="muted">Loading…</p></main>
<div class="tip" id="tip" role="tooltip"></div>
<script src="/currency.js"></script>
<script src="/split.js"></script>
<script src="/settle.js"></script>
<script src="/admin.js"></script>
</body>
</html>

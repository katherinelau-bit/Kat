# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: bei-cin-lah
    runtime: node
    plan: starter            # a persistent disk needs a paid instance
    buildCommand: npm install && node scripts/copy-ocr.js   # installs and copies the on-phone receipt reader
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: ANTHROPIC_API_KEY   # optional: switches on receipt reading
        sync: false
    disk:
      name: bei-cin-lah-data
      mountPath: /var/data
      sizeGB: 1

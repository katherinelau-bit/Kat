[build]
  publish = "public"
  functions = "netlify/functions"
  # Copies the on-phone receipt reader into public/ocr (see scripts/copy-ocr.js).
  command = "node scripts/copy-ocr.js"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Pretty links: /b/<bill id> and /new open the app.
[[redirects]]
  from = "/b/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/t/*"
  to = "/index.html"
  status = 200

# The back office (public/admin.html), locked by the ADMIN_KEY password.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[redirects]]
  from = "/trips"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/new"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"

# The receipt reader files are large and only change with a new version, so phones keep them for a week.
[[headers]]
  for = "/ocr/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
